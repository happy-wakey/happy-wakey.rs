name: generated-contract

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generated-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Runtime generated contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install jsonschema
        run: python3 -m pip install --quiet jsonschema
      - name: Check generated policy, freeze bits, and JSON Schema runtime
        run: python3 scripts/check-generated-contract.py --freeze --require-readonly
